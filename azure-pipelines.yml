trigger: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build

  jobs:

  - job: DockerBuild

    steps:

    - task: Docker@2

      displayName: Build and Push Docker Image

      inputs:
        containerRegistry: 'demo-azure-connection'
        repository: 'hackathon-app'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'

        tags: |
          latest

- stage: Deploy

  dependsOn: Build

  jobs:

  - job: DeployToAKS

    steps:

    - task: KubernetesManifest@1

      displayName: Deploy to AKS

      inputs:
        action: deploy

        kubernetesServiceConnection: 'demo-azure-connection'

        namespace: hackathon

        manifests: |
          k8s/deployment.yaml
          k8s/service.yaml